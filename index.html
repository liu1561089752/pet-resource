<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源宝库 - 免费资源分享站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1px solid var(--border);
            border-radius: 9999px;
            background: var(--bg);
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hero p {
            opacity: 0.9;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Categories */
        .categories {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .category-list {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 9999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .category-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
        }

        /* Main Content */
        .main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: var(--primary-light);
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Grid */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: block;
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-tags {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            background: #f1f5f9;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .tag.category-tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner {
                flex-wrap: wrap;
            }

            .search-box {
                order: 3;
                max-width: 100%;
                width: 100%;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            .resource-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo" onclick="resetFilter(); return false;">
                <div class="logo-icon">R</div>
                <span class="logo-text">资源宝库</span>
            </a>
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="searchInput" placeholder="搜索资源名称或标签..." autocomplete="off">
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>发现优质免费资源</h1>
        <p>精选游戏、软件、教程、影视素材等海量资源，一键直达下载</p>
    </section>

    <!-- Categories -->
    <section class="categories">
        <div class="category-list" id="categoryList">
            <button class="category-btn active" data-category="all">全部</button>
            <button class="category-btn" data-category="游戏">游戏</button>
            <button class="category-btn" data-category="软件">软件</button>
            <button class="category-btn" data-category="教程">教程</button>
            <button class="category-btn" data-category="影视素材">影视素材</button>
            <button class="category-btn" data-category="模板">模板</button>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main">
        <div class="section-header">
            <h2 class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--primary);">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                资源列表
                <span class="count-badge" id="countBadge">0</span>
            </h2>
        </div>
        <div class="resource-grid" id="resourceGrid">
            <!-- Cards will be rendered here -->
        </div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3>没有找到相关资源</h3>
            <p>请尝试更换关键词或分类</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>资源宝库 · 仅供学习交流使用 · 请支持正版</p>
    </footer>

    <script>
        // 资源数据
        const resources = [
            {
                id: 1,
                title: "赛博朋克 2077 终极版 + 全DLC 中文版",
                thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example1",
                tags: ["RPG", "开放世界", "科幻"],
                category: "游戏",
                date: "2024-01-15"
            },
            {
                id: 2,
                title: "Adobe Photoshop 2024 免安装绿色版",
                thumbnail: "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example2",
                tags: ["设计", "图像处理", "专业软件"],
                category: "软件",
                date: "2024-01-12"
            },
            {
                id: 3,
                title: "Unity 3D 游戏开发从入门到精通 视频教程",
                thumbnail: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example3",
                tags: ["编程", "游戏开发", "Unity"],
                category: "教程",
                date: "2024-01-10"
            },
            {
                id: 4,
                title: "4K 电影级 LUT 调色预设包 500+",
                thumbnail: "https://images.unsplash.com/photo-1536240478700-b869070f9279?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example4",
                tags: ["调色", "LUT", "后期制作"],
                category: "影视素材",
                date: "2024-01-08"
            },
            {
                id: 5,
                title: "极简商务 PPT 模板合集 100套",
                thumbnail: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example5",
                tags: ["PPT", "商务", "演示文稿"],
                category: "模板",
                date: "2024-01-05"
            },
            {
                id: 6,
                title: "艾尔登法环 黄金树幽影 豪华版",
                thumbnail: "https://images.unsplash.com/photo-1552820728-8b83bb6b2b0a?w=600&h=400&fit=crop",
                link: "https://pan.baidu.com/s/1example6",
                tags: ["魂类", "动作RPG", "高难度"],
                category: "游戏",
                date: "2024-01-03"
            }
        ];

        // DOM 元素
        const grid = document.getElementById('resourceGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const emptyState = document.getElementById('emptyState');
        const countBadge = document.getElementById('countBadge');

        let currentCategory = 'all';
        let searchQuery = '';

        // 渲染资源卡片
        function renderResources(items) {
            grid.innerHTML = '';
            countBadge.textContent = items.length;

            if (items.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}" class="card-image" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                    <div class="card-body">
                        <div class="card-tags">
                            <span class="tag category-tag">${item.category}</span>
                            ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <h3 class="card-title">${escapeHtml(item.title)}</h3>
                        <div class="card-meta">
                            <span class="card-date">${item.date}</span>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="download-btn" onclick="event.stopPropagation()">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                下载
                            </a>
                        </div>
                    </div>
                `;

                // 点击卡片跳转（除了点击下载按钮）
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.download-btn')) {
                        window.open(item.link, '_blank');
                    }
                });

                grid.appendChild(card);
            });
        }

        // 过滤资源
        function filterResources() {
            let filtered = resources;

            // 按分类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }

            // 按搜索词筛选
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(query) ||
                    item.tags.some(tag => tag.toLowerCase().includes(query)) ||
                    item.category.toLowerCase().includes(query)
                );
            }

            renderResources(filtered);
        }

        // 转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 分类按钮事件
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                filterResources();
            });
        });

        // 搜索事件
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            filterResources();
        });

        // 重置筛选
        function resetFilter() {
            currentCategory = 'all';
            searchQuery = '';
            searchInput.value = '';
            categoryButtons.forEach(b => b.classList.remove('active'));
            categoryButtons[0].classList.add('active');
            filterResources();
        }

        // 初始化
        renderResources(resources);
    </script>
</body>
</html>
