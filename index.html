<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源宝库 - 免费优质资源分享</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航（已移除管理按钮） -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">📦</div>
        <span>资源宝库</span>
      </a>
      <!-- 搜索框自动占满右侧空间 -->
      <div class="search-wrap" style="max-width: 520px; margin-left: auto;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="搜索资源名称、标签..." autocomplete="off">
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1>发现优质免费资源</h1>
      <p>精选音乐、游戏、软件、壁纸、学习资料，一键直达下载</p>
    </div>
  </section>

  <!-- 分类 -->
  <section class="categories">
    <div class="category-list" id="categoryList"></div>
  </section>

  <!-- 主内容 -->
  <main class="main">
    <div class="section-header">
      <h2 class="section-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        资源列表
        <span class="badge" id="countBadge">0</span>
      </h2>
    </div>
    
    <div class="resource-grid" id="resourceGrid"></div>
    
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h3>未找到相关资源</h3>
      <p>尝试更换关键词或切换分类</p>
    </div>
  </main>

  <!-- 免责声明 -->
  <div class="disclaimer">
    <svg class="disclaimer-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <div class="disclaimer-content">
      <h4>免责声明</h4>
      <p>本站所有内容均搜集于互联网，仅供学习交流，请于下载后24小时内删除。如有侵权请及时联系我们将立即处理。</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>资源宝库 · 仅供学习交流 · 请支持正版</p>
  </footer>

  <!-- 下载确认模态框 -->
  <div class="modal-overlay" id="disclaimerModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">⚠️ 下载确认</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="disclaimer" style="margin:0;">
          <svg class="disclaimer-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <div class="disclaimer-content">
            <h4>免责声明</h4>
            <p>本站所有内容均搜集于互联网，仅供学习交流，请于下载后24小时内删除。如有侵权请及时联系我们将立即处理。</p>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:0.5rem;margin-top:1rem;font-size:0.9rem;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="agreeCheck">
          我已阅读并同意上述声明
        </label>
        <label style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="rememberCheck">
          不再提示（24小时内）
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" id="confirmDownloadBtn">确认下载</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    const categories = ['全部', '音乐', '游戏', '软件', '壁纸', '学习'];
    let currentCategory = '全部';
    let searchQuery = '';
    let pendingLink = null;
    
    const categoryList = document.getElementById('categoryList');
    const resourceGrid = document.getElementById('resourceGrid');
    const emptyState = document.getElementById('emptyState');
    const countBadge = document.getElementById('countBadge');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('disclaimerModal');
    const agreeCheck = document.getElementById('agreeCheck');
    const rememberCheck = document.getElementById('rememberCheck');
    const confirmBtn = document.getElementById('confirmDownloadBtn');
    
    // 渲染分类
    function renderCategories() {
      categoryList.innerHTML = categories.map(cat => `
        <button class="category-chip ${cat === currentCategory ? 'active' : ''}" 
                onclick="setCategory('${cat}')">${cat}</button>
      `).join('');
    }
    
    function setCategory(cat) {
      currentCategory = cat;
      renderCategories();
      filterAndRender();
    }
    
    // 过滤与渲染
    function filterAndRender() {
      let filtered = RESOURCES_DATA.filter(item => {
        const matchCat = currentCategory === '全部' || item.category === currentCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchSearch = !q || 
          item.title.toLowerCase().includes(q) ||
          item.tags.some(t => t.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      countBadge.textContent = filtered.length;
      
      if (filtered.length === 0) {
        resourceGrid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      resourceGrid.style.display = 'grid';
      emptyState.style.display = 'none';
      
      resourceGrid.innerHTML = filtered.map((item, i) => `
        <div class="card" style="animation-delay: ${i * 0.06}s">
          <div class="card-image-wrap">
            <img src="${item.thumbnail}" alt="${escapeHtml(item.title)}" class="card-image" loading="lazy" 
                 onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
            <span class="card-category-badge">${item.category}</span>
          </div>
          <div class="card-body">
            <div class="card-tags">
              ${item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            </div>
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            <div class="card-meta">
              <span class="card-date">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:text-bottom;">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${item.date}
              </span>
              <button class="btn-download" onclick="handleDownload('${item.link}', event)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                下载
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // 下载处理
    function handleDownload(link, e) {
      e.stopPropagation();
      pendingLink = link;
      
      const agreed = localStorage.getItem('disclaimer_agreed');
      const expiry = localStorage.getItem('disclaimer_expiry');
      
      if (agreed === 'true' && expiry && Date.now() < parseInt(expiry)) {
        window.open(link, '_blank');
        return;
      }
      
      agreeCheck.checked = false;
      rememberCheck.checked = false;
      modal.classList.add('active');
    }
    
    confirmBtn.onclick = () => {
      if (!agreeCheck.checked) {
        alert('请先勾选"我已阅读并同意上述声明"');
        return;
      }
      if (rememberCheck.checked) {
        localStorage.setItem('disclaimer_agreed', 'true');
        localStorage.setItem('disclaimer_expiry', Date.now() + 24 * 60 * 60 * 1000);
      }
      closeModal();
      if (pendingLink) window.open(pendingLink, '_blank');
    };
    
    function closeModal() {
      modal.classList.remove('active');
      pendingLink = null;
    }
    
    modal.onclick = (e) => {
      if (e.target === modal) closeModal();
    };
    
    // 搜索
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      filterAndRender();
    });
    
    // 初始化
    renderCategories();
    filterAndRender();
  </script>
</body>
</html>
